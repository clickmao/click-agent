# ==============================================
# 模型目录 (L1 base, models.yaml) — C.6.2 (v0.11.0 格式重构)
# 顶层键 modules: 数组 — 每模型一个条目:
#   name            模型名 (全局唯一, /model <name> 引用)
#   description     人读描述 (一句话能力/定位)
#   provider        服务商 (openai/anthropic/google/xai/deepseek/zhipu/dashscope/moonshot)
#   request_address chat completions 完整 URL (官方或兼容端点)
#   api_key         API Key 的环境变量名 (凭据铁律: key 本身永不落配置)
#   cost_estimate   费用预估 (USD/每百万 token: 输入/输出, 公开牌价)
#   reasoning_score 推理能力预估 1-10 (公开评测归一化)
#   coding_score    编码能力预估 1-10
#   context_window  上下文窗口 (token)
#   suited_for      适合用途 (意图匹配: general/coding/reasoning/planning/chat/summary/classify/debug)
# 参数真实性 (C.6.5): 可达端点经实际 http 校验 (假 key 期望 401 = 地址合法), 校验命令 /model verify <name>;
# 价格为公开牌价, 变动以 provider 官网为准
# 校验记录 (v0.11.0 全目录 19 模型真机 verify, 2026-09-06):
#   VALID   11: deepseek-chat/reasoner/v3.2 (401) glm-4-flash/plus/4.5 (401) claude-sonnet-4-5/haiku-4-5 (403)
#               kimi-k2 (401) qwen3-max/coder-plus (401) — 401/403 = 地址正确且鉴权拒绝 (假 key 符合预期)
#   UNREACHABLE 8: gpt-4o/gpt-4o-mini/o4-mini/gpt-5 (api.openai.com) gemini-2.5-pro/flash (googleapis.com)
#               grok-4/grok-4-fast (api.x.ai) — 三个域名在当前部署网络被 RST/DNS 阻塞 (curl 直连同证),
#               目录参数保留 (公网可达环境正常), 代理配置后即可复验
# ==============================================
