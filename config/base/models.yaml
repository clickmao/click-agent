# ==============================================
# 模型目录 (L1 base, models.yaml) — C.6.2
# 每模型: 除 API-KEY 外全部参数 (key 只存环境变量名, 凭据铁律)
# 参数真实性 (C.6.5): 目录内模型均经实际 http 校验 (假 key 期望 401 = 地址合法),
# 校验命令 /model verify <id>; 价格为公开牌价 (USD/每百万 token), 变动以 provider 官网为准
# 校验记录 (2026-09-06 全目录真机探测): deepseek/bigmodel 4/6 端点 401=合法;
# api.openai.com 在当前部署网络被 RST (与 github smart-http 同类网络策略), 2/6 不可达 —
# 目录参数保留 (公网可达环境正常), verify 命令在可达环境如实报 VALID/UNREACHABLE
# ==============================================
models:
  # ── OpenAI ──
  - id: gpt-4o
    provider: openai
    endpoint: https://api.openai.com/v1/chat/completions
    api_key_env: AGENT_OPENAI_KEY
    price_in_per_m: 2.50
    price_out_per_m: 10.00
    reasoning_score: 8
    coding_score: 8
    context_window: 128000
    suited_for: [general, coding, reasoning, planning]

  - id: gpt-4o-mini
    provider: openai
    endpoint: https://api.openai.com/v1/chat/completions
    api_key_env: AGENT_OPENAI_KEY
    price_in_per_m: 0.15
    price_out_per_m: 0.60
    reasoning_score: 6
    coding_score: 6
    context_window: 128000
    suited_for: [general, chat, summary, classify]

  # ── DeepSeek ──
  - id: deepseek-chat
    provider: deepseek
    endpoint: https://api.deepseek.com/v1/chat/completions
    api_key_env: DEEPSEEK_KEY
    price_in_per_m: 0.27
    price_out_per_m: 1.10
    reasoning_score: 7
    coding_score: 8
    context_window: 64000
    suited_for: [general, coding, summary]

  - id: deepseek-reasoner
    provider: deepseek
    endpoint: https://api.deepseek.com/v1/chat/completions
    api_key_env: DEEPSEEK_KEY
    price_in_per_m: 0.55
    price_out_per_m: 2.19
    reasoning_score: 9
    coding_score: 8
    context_window: 64000
    suited_for: [reasoning, planning, debug]

  # ── 智普 GLM ──
  - id: glm-4-flash
    provider: zhipu
    endpoint: https://open.bigmodel.cn/api/paas/v4/chat/completions
    api_key_env: ZHIPU_KEY
    price_in_per_m: 0.10
    price_out_per_m: 0.10
    reasoning_score: 5
    coding_score: 5
    context_window: 128000
    suited_for: [chat, summary, classify]

  - id: glm-4-plus
    provider: zhipu
    endpoint: https://open.bigmodel.cn/api/paas/v4/chat/completions
    api_key_env: ZHIPU_KEY
    price_in_per_m: 7.00
    price_out_per_m: 7.00
    reasoning_score: 8
    coding_score: 7
    context_window: 128000
    suited_for: [general, reasoning, planning]

# ── 官方端点代理 (v0.10.0 需求③: 官方/远端 API 出网代理 — 可配置) ──
# 留空 = 直连; http://user:pass@host:port 认证代理也支持。
# 官方通道 (openai 等被 RST 的端点) 经代理出网 — 启动时读取一次 (改后需重启)
proxy:
  url: ""            # 例: http://127.0.0.1:7890
  bypass_local: true # 本地/内网地址不走代理

# ── 本地推理通道 (v0.10.0 需求①: 本地模型真接入混合调度) ──
# gguf 对话模型路径 (文件缺失 → 本地通道诚实降级为不可用, 不伪造; RemoteCatalog 照常服务)
# bge 嵌入模型见 core.yaml embedding 段 — 两者独立
local:
  model_path: /home/agentuser/models/llama-dialog.gguf   # 占位: 放置真实对话 gguf 后本地通道生效
  context_size: 4096
  gpu_layers: 0        # vulkan offload 层数 (0 = 纯 CPU)

# ── 余额查询方案 (C.6.4) ──
# 调研结论 (2026-09-06): 各 provider 余额/账单接口差异大 (OpenAI=credit_grants 依赖项目账单迁移,
# DeepSeek=/user/balance, 智普=无公开余额 API) → scheme 枚举按 provider 分派, 未知 provider 诚实报错
balance_schemes:
  openai:
    endpoint: https://api.openai.com/v1/dashboard/billing/subscription
    note: credit_grants 已随账单迁移废弃, 用 subscription 端点取 hard_limit_usd 作额度上界
  deepseek:
    endpoint: https://api.deepseek.com/user/balance
    note: GET + Bearer; balance 字段 USD
