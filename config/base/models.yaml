# 可达性实测 (2026-09-10, 本机网络, 假 key 探针): Groq 403 / OpenRouter 401 / Cerebras 403 /
#   NVIDIA 401 = 地址合法且鉴权拒绝 (端点真实); Google Gemini 000 = googleapis.com 在本部署网络被阻塞
#   (与既有 gemini-2.5 条目同因; 公网/代理环境可用, 条目保留)。
proxy:
  url: ""            # 例: http://127.0.0.1:7890
  bypass_local: true # 本地/内网地址不走代理

# ── 本地推理通道 (v0.10.0 需求①: 本地模型真接入混合调度) ──
# gguf 对话模型路径 (文件缺失 → 本地通道诚实降级为不可用, 不伪造; RemoteCatalog 照常服务)
# bge 嵌入模型见 core.yaml embedding 段 — 两者独立
local:
  model_path: /home/agentuser/models/qwen2.5-0.5b-instruct-q4_k_m.gguf  # R104: 真对话模型 (Qwen2.5-0.5B-Instruct q4_k_m)
  context_size: 4096
  gpu_layers: 0        # vulkan offload 层数 (0 = 纯 CPU)

# ── 余额查询方案 (C.6.4) ──
# 调研结论 (2026-09-06): 各 provider 余额/账单接口差异大 (OpenAI=credit_grants 依赖项目账单迁移,
# DeepSeek=/user/balance, 智普=无公开余额 API) → scheme 枚举按 provider 分派, 未知 provider 诚实报错
balance_schemes:
  openai:
    request_address: https://api.openai.com/v1/dashboard/billing/subscription
    note: credit_grants 已随账单迁移废弃, 用 subscription 端点取 hard_limit_usd 作额度上界
  deepseek:
    request_address: https://api.deepseek.com/user/balance
    note: GET + Bearer; balance 字段 USD
