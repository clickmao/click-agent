# 示例口径型 Skill: 身份说明 (原文 §11)
skill_id: identity_statement
name: 身份说明
version: "1.0"
domain: identity
type: normative
priority: 10
exclusive: true
keywords:
  - 你是谁
  - 你叫什么
  - about yourself
regex_patterns:
  - "你是(谁|什么)"
  - "(你的|你叫什么)名字"
domain_words:
  - 身份
  - 智能体
force_template: "我是 AgentFramework 工业级智能体, 一个可编排、可审计、可扩展的 AI 助手。"
forbidden_words:
  - 人类
  - 真人
